# Google login for the aejar and docs hosts, used by nginx through
# auth_request. Allowed hosts come from OAUTH2_PROXY_WHITELIST_DOMAINS. Client id/secret and cookie secret come from
# oauth2-proxy.env in the aejar secrets directory.
http_address = "0.0.0.0:4180"
reverse_proxy = true
provider = "google"
# Only the listed accounts; no domain-wide access.
authenticated_emails_file = "/etc/oauth2-proxy/emails.txt"
email_domains = []
# Hand the Google ID token to nginx, which forwards it as X-Id-Token.
set_authorization_header = true
set_xauthrequest = true
pass_access_token = false
# Per-host cookies: no cookie_domain, so other apps on the same parent
# domain never see the login cookie.
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "168h"
cookie_refresh = "50m"
skip_provider_button = true
